name: local-runtime-pr-gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      rounds:
        description: "Smoke rounds for the PR gate"
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: local-runtime-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-pr-localagent-tests:
    name: windows-pr-localagent-tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run doramate-localagent cargo test
        working-directory: ./doramate-localagent
        run: cargo test --locked

  windows-pr-frontend-tests:
    name: windows-pr-frontend-tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run doramate-frontend cargo test
        working-directory: ./doramate-frontend
        run: cargo test --locked

  windows-pr-live-smoke:
    name: windows-pr-live-smoke
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CARGO_TERM_COLOR: always
      PR_GATE_ROUNDS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rounds || '3' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Vendor Dora source
        run: ./dora-api-csharp/scripts/bootstrap-dora.ps1

      - name: Build Dora CLI
        working-directory: ./dora-api-csharp/third_party/dora
        run: cargo build -p dora-cli --release

      - name: Add Dora CLI to PATH
        run: |
          $doraBin = Join-Path $PWD 'dora-api-csharp/third_party/dora/target/release'
          $doraBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $doraBin 'dora.exe') --version

      - name: Run PR local runtime release gate
        run: ./scripts/release-gate-local-runtime.ps1 -Rounds $env:PR_GATE_ROUNDS -SkipLocalAgentTests -SkipFrontendTests

      - name: Upload release gate summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-pr-gate-windows
          path: out/release-gates/
          if-no-files-found: warn

  windows-pr-e2e-p0:
    name: windows-pr-e2e-p0
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Pester
        run: Install-Module -Name Pester -Force -SkipPublisherCheck

      - name: Vendor Dora source
        run: ./dora-api-csharp/scripts/bootstrap-dora.ps1

      - name: Build Dora CLI
        working-directory: ./dora-api-csharp/third_party/dora
        run: cargo build -p dora-cli --release

      - name: Add Dora CLI to PATH
        run: |
          $doraBin = Join-Path $PWD 'dora-api-csharp/third_party/dora/target/release'
          $doraBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $doraBin 'dora.exe') --version

      - name: Build smoke sample
        working-directory: ./dora-api-csharp/samples/csharp-dataflow
        run: dotnet build CSharpNode.csproj -c Release -p:NuGetAudit=false

      - name: Build LocalAgent
        run: cargo build -p doramate-localagent

      - name: Run E2E P0 tests
        run: |
          $config = @{ Run = @{ Exit = $true } }
          $result = Invoke-Pester ./tests/e2e/LocalAgentE2E.Tests.ps1 -Configuration $config -Tag "P0" -PassThru
          if ($result.FailedCount -gt 0) {
            throw "E2E P0 tests failed: $($result.FailedCount) failure(s)"
          }
