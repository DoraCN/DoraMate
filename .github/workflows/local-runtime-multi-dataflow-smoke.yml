name: local-runtime-multi-dataflow-smoke

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Sample profile to run"
        required: false
        default: "complete"
      rounds:
        description: "Smoke rounds per dataflow sample"
        required: false
        default: "3"

jobs:
  windows-multi-dataflow-smoke:
    name: windows-multi-dataflow-smoke
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Vendor Dora source
        run: ./dora-api-csharp/scripts/bootstrap-dora.ps1

      - name: Build Dora CLI
        working-directory: ./dora-api-csharp/third_party/dora
        run: cargo build -p dora-cli --release

      - name: Build native C libraries (dora-node-api-c, dora-operator-api-c)
        working-directory: ./dora-api-csharp
        run: ./scripts/build-native.ps1 -Configuration Release

      - name: Add Dora CLI to PATH
        run: |
          $doraBin = Join-Path $PWD 'dora-api-csharp/third_party/dora/target/release'
          $doraBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $doraBin 'dora.exe') --version

      - name: Ensure local NuGet source exists
        run: New-Item -ItemType Directory -Force -Path dora-api-csharp/artifacts/packages | Out-Null

      - name: Run multi-dataflow smoke
        run: ./scripts/smoke-localagent-multi-dataflow.ps1 -Profile ${{ github.event.inputs.profile }} -Rounds ${{ github.event.inputs.rounds }}

      - name: Upload multi-dataflow smoke summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-multi-dataflow-smoke-windows
          path: out/release-gates/multi-dataflow/
          if-no-files-found: warn
