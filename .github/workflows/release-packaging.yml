name: release-packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v0.10.0)"
        required: false
        default: "v0.10.0"

jobs:
  build-and-package:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install trunk (WASM bundler)
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Vendor Dora source
        run: ./dora-api-csharp/scripts/bootstrap-dora.ps1

      - name: Build Dora CLI
        working-directory: ./dora-api-csharp/third_party/dora
        run: cargo build -p dora-cli --release

      - name: Build release artifacts
        run: ./scripts/build-release.ps1 -SkipTests

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: doramate-${{ github.ref_name }}-win-x64
          path: out/dist/*.zip
          if-no-files-found: error

      - name: Generate release notes
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $changelog = Get-Content docs/CHANGELOG.md -Raw
          # Extract section for this version
          $pattern = "## \[$version\]"
          if ($changelog -match "$pattern.*?(?=## \[|\Z)") {
            $notes = $matches[0].Trim()
            Set-Content -Path out/release-notes.md -Value $notes -Encoding UTF8
            Write-Host "Release notes extracted for v$version"
          } else {
            Set-Content -Path out/release-notes.md -Value "DoraMate $($version) release." -Encoding UTF8
            Write-Host "No matching changelog section found; using default notes."
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/dist/*.zip
          body_path: out/release-notes.md
          generate_release_notes: false
