name: local-runtime-standard-release-gate

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Smoke rounds for the standard release gate (20-50)"
        required: false
        default: "20"
      skip_e2e_precheck:
        description: "Skip E2E P0 pre-check (use only for triage/debug)"
        required: false
        default: "false"

jobs:
  e2e-precheck:
    name: e2e-p0-precheck
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Vendor Dora source
        run: ./dora-api-csharp/scripts/bootstrap-dora.ps1

      - name: Build Dora CLI
        working-directory: ./dora-api-csharp/third_party/dora
        run: cargo build -p dora-cli --release

      - name: Build native C libraries (dora-node-api-c, dora-operator-api-c)
        working-directory: ./dora-api-csharp
        run: ./scripts/build-native.ps1 -Configuration Release

      - name: Add Dora CLI to PATH
        run: |
          $doraBin = Join-Path $PWD 'dora-api-csharp/third_party/dora/target/release'
          $doraBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $doraBin 'dora.exe') --version

      - name: Ensure local NuGet source exists
        run: New-Item -ItemType Directory -Force -Path dora-api-csharp/artifacts/packages | Out-Null

      - name: Build C# Node SDK
        working-directory: ./dora-api-csharp
        run: dotnet build src/DoraNode/DoraNode.csproj -c Release -p:NuGetAudit=false

      - name: Build C# Operator SDK
        working-directory: ./dora-api-csharp
        run: dotnet build src/DoraOperator/DoraOperator.csproj -c Release -p:NuGetAudit=false

      - name: Build C# sample projects
        shell: pwsh
        run: |
          $samples = @(
            "samples/csharp-dataflow/CSharpNode.csproj",
            "samples/csharp-multi-node/Producer.csproj",
            "samples/csharp-multi-node/Consumer.csproj",
            "samples/csharp-async-node-dataflow/Producer.csproj",
            "samples/csharp-async-node-dataflow/Consumer.csproj",
            "samples/csharp-arrow-node-dataflow/Producer.csproj",
            "samples/csharp-arrow-node-dataflow/Consumer.csproj",
            "samples/csharp-advanced-arrow-node-dataflow/Producer.csproj",
            "samples/csharp-advanced-arrow-node-dataflow/Consumer.csproj",
            "samples/csharp-complex-arrow-contract-node-dataflow/Producer.csproj",
            "samples/csharp-complex-arrow-contract-node-dataflow/Consumer.csproj",
            "samples/csharp-operator-dataflow/CSharpCounterOperator.csproj",
            "samples/csharp-operator-dataflow/Producer.csproj",
            "samples/csharp-operator-dataflow/Sink.csproj",
            "samples/csharp-operator-arrow-roundtrip/RecordBatchProducerOperator.csproj",
            "samples/csharp-operator-arrow-roundtrip/RecordBatchVerifierOperator.csproj",
            "samples/csharp-operator-arrow-roundtrip/Producer.csproj",
            "samples/csharp-operator-arrow-roundtrip/Sink.csproj",
            "samples/csharp-operator-contract-arrow-dataflow/ContractBatchProducerOperator.csproj",
            "samples/csharp-operator-contract-arrow-dataflow/ContractBatchVerifierOperator.csproj",
            "samples/csharp-operator-contract-arrow-dataflow/Producer.csproj",
            "samples/csharp-operator-contract-arrow-dataflow/Sink.csproj",
            "samples/csharp-node-operator-arrow-dataflow/RecordBatchForwardOperator.csproj",
            "samples/csharp-node-operator-arrow-dataflow/Producer.csproj",
            "samples/csharp-node-operator-arrow-dataflow/Consumer.csproj"
          )
          Push-Location dora-api-csharp
          try {
            $failed = @()
            foreach ($proj in $samples) {
              Write-Host "  Building: $proj" -ForegroundColor Cyan
              dotnet build $proj -c Release -p:NuGetAudit=false 2>&1 | Out-Host
              if ($LASTEXITCODE -ne 0) {
                $failed += $proj
              }
            }
            if ($failed.Count -gt 0) {
              throw "Build failed for $($failed.Count) project(s):`n$($failed -join "`n")"
            }
          }
          finally {
            Pop-Location
          }

      - name: Install Pester if needed
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module -Name Pester -Force -SkipPublisherCheck
          }

      - name: Build LocalAgent
        run: cargo build -p doramate-localagent --locked

      - name: Run E2E P0 pre-check
        if: ${{ github.event.inputs.skip_e2e_precheck != 'true' }}
        run: |
          Write-Host "Running E2E P0 pre-check before standard release gate..."
          $config = @{ Run = @{ Exit = $true }; Filter = @{ Tag = @{ Include = @('P0') } } }
          Invoke-Pester ./tests/e2e/LocalAgentE2E.Tests.ps1 -Configuration $config
          if ($LASTEXITCODE -ne 0) {
            throw "E2E P0 pre-check failed — aborting release gate. If this is expected, rerun with skip_e2e_precheck=true."
          }
          Write-Host "E2E P0 pre-check passed."

      - name: Upload E2E pre-check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-precheck-logs
          path: out/e2e/
          if-no-files-found: warn

  windows-standard-release-gate:
    needs: e2e-precheck
    if: ${{ !failure() }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Vendor Dora source
        run: ./dora-api-csharp/scripts/bootstrap-dora.ps1

      - name: Build Dora CLI
        working-directory: ./dora-api-csharp/third_party/dora
        run: cargo build -p dora-cli --release

      - name: Build native C libraries (dora-node-api-c, dora-operator-api-c)
        working-directory: ./dora-api-csharp
        run: ./scripts/build-native.ps1 -Configuration Release

      - name: Add Dora CLI to PATH
        run: |
          $doraBin = Join-Path $PWD 'dora-api-csharp/third_party/dora/target/release'
          $doraBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $doraBin 'dora.exe') --version

      - name: Run standard local runtime release gate
        run: ./scripts/release-gate-local-runtime-standard.ps1 -Rounds ${{ github.event.inputs.rounds }}

      - name: Upload release gate summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-release-gate-windows
          path: out/release-gates/
          if-no-files-found: warn

      - name: Generate trend summary
        if: always()
        run: ./scripts/summarize-local-runtime-trends.ps1

      - name: Upload trend summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-trends
          path: out/release-gates/trends/
          if-no-files-found: warn
