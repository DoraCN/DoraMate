name: local-runtime-e2e

on:
  schedule:
    - cron: '0 6 * * 1-5'    # 工作日每天早上 6 点
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: windows-e2e-tests
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install Pester
        run: Install-Module -Name Pester -Force -SkipPublisherCheck

      - name: Vendor Dora source
        run: ./dora-api-csharp/scripts/bootstrap-dora.ps1

      - name: Build Dora CLI
        working-directory: ./dora-api-csharp/third_party/dora
        run: cargo build -p dora-cli --release

      - name: Build native C libraries (dora-node-api-c, dora-operator-api-c)
        working-directory: ./dora-api-csharp
        run: ./scripts/build-native.ps1 -Configuration Release

      - name: Add Dora CLI to PATH
        run: |
          $doraBin = Join-Path $PWD 'dora-api-csharp/third_party/dora/target/release'
          $doraBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $doraBin 'dora.exe') --version

      - name: Ensure local NuGet source exists
        run: New-Item -ItemType Directory -Force -Path dora-api-csharp/artifacts/packages | Out-Null

      - name: Build C# Node SDK
        working-directory: ./dora-api-csharp
        run: dotnet build src/DoraNode/DoraNode.csproj -c Release -p:NuGetAudit=false

      - name: Build C# Operator SDK
        working-directory: ./dora-api-csharp
        run: dotnet build src/DoraOperator/DoraOperator.csproj -c Release -p:NuGetAudit=false

      - name: Build C# template pack
        working-directory: ./dora-api-csharp
        run: dotnet build templates/DoraMate.Templates.csproj -c Release -p:NuGetAudit=false

      - name: Build C# sample projects
        working-directory: ./dora-api-csharp
        run: ./scripts/build-csharp-sample-projects.ps1 -Configuration Release

      - name: Run full C# sample smoke suite
        run: ./scripts/smoke-csharp-bindings.ps1 -Profile complete -Rounds 1 -SkipBuild

      - name: Build C# operator projects (NativeAOT publish)
        working-directory: ./dora-api-csharp
        run: dotnet publish samples/csharp-operator-dataflow/CSharpCounterOperator.csproj -c Release -p:NuGetAudit=false

      - name: Build template projects from dotnet new
        shell: pwsh
        run: |
          $tempDir = Join-Path $env:TEMP "doramate-ci-templates-$([System.IO.Path]::GetRandomFileName())"
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          try {
            Push-Location dora-api-csharp
            try {
              # Pack templates
              dotnet pack templates/DoraMate.Templates.csproj -c Release -p:NuGetAudit=false -o artifacts/templates
              if ($LASTEXITCODE -ne 0) { throw "Template pack failed" }

              # Install and test dora-node
              $nupkg = Get-ChildItem artifacts/templates -Filter "DoraMate.Templates.*.nupkg" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              dotnet new install $nupkg.FullName --force
              if ($LASTEXITCODE -ne 0) { throw "Template install failed" }

              dotnet new dora-node -n TestNode -o (Join-Path $tempDir "TestNode")
              if ($LASTEXITCODE -ne 0) { throw "dora-node template creation failed" }
              dotnet build (Join-Path $tempDir "TestNode") -c Release -p:NuGetAudit=false
              if ($LASTEXITCODE -ne 0) { throw "dora-node template build failed" }
              Write-Host "[OK] dora-node template" -ForegroundColor Green

              dotnet new dora-operator -n TestOperator -o (Join-Path $tempDir "TestOperator")
              if ($LASTEXITCODE -ne 0) { throw "dora-operator template creation failed" }
              Write-Host "[OK] dora-operator template created" -ForegroundColor Green
            }
            finally {
              Pop-Location
            }
          }
          finally {
            if (Test-Path $tempDir) { Remove-Item -Recurse -Force $tempDir }
          }

      - name: Build LocalAgent
        working-directory: ./doramate-localagent
        run: cargo build --bin doramate-localagent

      - name: Run E2E test suite (all scenarios)
        run: |
          $config = @{ Run = @{ Exit = $true } }
          $result = Invoke-Pester ./tests/e2e/LocalAgentE2E.Tests.ps1 -Configuration $config -PassThru
          if ($result.FailedCount -gt 0) {
            throw "E2E tests failed: $($result.FailedCount) failure(s)"
          }

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results
          path: out/e2e/
          if-no-files-found: warn
