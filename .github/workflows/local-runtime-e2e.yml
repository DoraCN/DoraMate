name: local-runtime-e2e

on:
  schedule:
    - cron: '0 6 * * 1-5'    # 工作日每天早上 6 点
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: windows-e2e-tests
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install Pester
        run: Install-Module -Name Pester -Force -SkipPublisherCheck

      - name: Vendor Dora source
        run: ./dora-api-csharp/scripts/bootstrap-dora.ps1

      - name: Build Dora CLI
        working-directory: ./dora-api-csharp/third_party/dora
        run: cargo build -p dora-cli --release

      - name: Build native C libraries (dora-node-api-c, dora-operator-api-c)
        working-directory: dora-api-csharp
        run: pwsh ./scripts/build-native.ps1 -Configuration Release

      - name: Add Dora CLI to PATH
        run: |
          $doraBin = Join-Path $PWD 'dora-api-csharp/third_party/dora/target/release'
          $doraBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $doraBin 'dora.exe') --version

      - name: Ensure local NuGet source exists
        run: New-Item -ItemType Directory -Force -Path dora-api-csharp/artifacts/packages | Out-Null

      - name: Build smoke sample
        working-directory: ./dora-api-csharp/samples/csharp-dataflow
        run: dotnet build CSharpNode.csproj -c Release -p:NuGetAudit=false

      - name: Build LocalAgent
        working-directory: ./doramate-localagent
        run: cargo build --bin doramate-localagent

      - name: Run E2E test suite (all scenarios)
        run: |
          $config = @{ Run = @{ Exit = $true } }
          $result = Invoke-Pester ./tests/e2e/LocalAgentE2E.Tests.ps1 -Configuration $config -PassThru
          if ($result.FailedCount -gt 0) {
            throw "E2E tests failed: $($result.FailedCount) failure(s)"
          }

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results
          path: out/e2e/
          if-no-files-found: warn
