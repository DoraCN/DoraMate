nodes:
- id: webcam
  build: cargo build --release -p webcam
  path: target/release/webcam
  inputs:
    tick: dora/timer/millis/100
  outputs:
  - frame
  env:
    PATH: C:\vcpkg\installed\x64-windows\bin;${PATH}
- id: object_detection
  build: cargo build --release -p object_detection
  path: target/release/object_detection
  inputs:
    frame: webcam/frame
  outputs:
  - detections
  env:
    PATH: C:\vcpkg\installed\x64-windows\bin;${PATH}
- id: csharp_detection_summary
  build: dotnet build csharp_detection_summary/CSharpDetectionSummary.csproj -c Release -p:NuGetAudit=false
  path: csharp_detection_summary/bin/Release/net8.0/CSharpDetectionSummary.exe
  inputs:
    detections: object_detection/detections
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    DOTNET_CLI_HOME: ./.dotnet-cli
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
- id: viewer
  build: cargo build --release -p viewer
  path: target/release/viewer
  inputs:
    detections: object_detection/detections
    frame: webcam/frame
  outputs:
  - detections
  env:
    PATH: C:\vcpkg\installed\x64-windows\bin;${PATH}
- id: recorder
  build: cargo build --release -p recorder
  path: target/release/recorder
  inputs:
    detections: object_detection/detections
    frame: webcam/frame
  env:
    RECORDER_OUTPUT: recording.avi
    RECORDER_FPS: '30'
    PATH: C:\vcpkg\installed\x64-windows\bin;${PATH}
