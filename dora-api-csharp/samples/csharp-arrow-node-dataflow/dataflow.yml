nodes:
  - id: producer
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_HOME: "../../.dotnet-cli"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    build: |
      dotnet build Producer.csproj -c Release -p:NuGetAudit=false
    path: ../../artifacts/samples/csharp-arrow-node-dataflow/Producer/Release/net8.0/CSharpArrowNodeProducer
    inputs:
      tick: dora/timer/millis/300
    outputs:
      - batch

  - id: consumer
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_HOME: "../../.dotnet-cli"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    build: |
      dotnet build Consumer.csproj -c Release -p:NuGetAudit=false
    path: ../../artifacts/samples/csharp-arrow-node-dataflow/Consumer/Release/net8.0/CSharpArrowNodeConsumer
    inputs:
      batch: producer/batch