nodes:
  - id: producer
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_HOME: "../../.dotnet-cli"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    build: |
      dotnet build Producer.csproj -c Release -p:NuGetAudit=false
    path: ../../artifacts/samples/csharp-async-node-dataflow/Producer/Release/net8.0/CSharpAsyncNodeProducer
    outputs:
      - message

  - id: consumer
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_HOME: "../../.dotnet-cli"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    build: |
      dotnet build Consumer.csproj -c Release -p:NuGetAudit=false
    path: ../../artifacts/samples/csharp-async-node-dataflow/Consumer/Release/net8.0/CSharpAsyncNodeConsumer
    inputs:
      message: producer/message